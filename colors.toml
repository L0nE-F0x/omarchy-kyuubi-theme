# Kyuubi — Nine tails. Unsealed fire.
# Working copy (v2). Omarchy generates app configs from this palette.
# Themes may also ship btop.theme, shell.toml, and (for local / non-git
# installs) hyprland.lua, neovim.lua, and terminal configs; those are
# not overwritten when present.
mode = "dark"

# Kurama chakra orange, crimson eye, ember gold, warm seal-black.
accent = "#F26B1D"
selection = "#5A1E14"
muted = "#A07A62"

background = "#160C0B"
dark_background = "#100807"
darker_background = "#0A0605"
lighter_background = "#2A1610"

foreground = "#FFE8C8"
dark_foreground = "#B8957A"
light_foreground = "#E8C9A8"
bright_foreground = "#FFF3E0"

# Animated by hyprland.lua (borderangle loop) on local installs.
hyprland_active_border = "rgba(f26b1dee) rgba(c41e3aee) rgba(f0b429ee)"
hyprland_inactive_border = "rgba(3a2218aa)"

red = "#C41E3A"
yellow = "#F0B429"
orange = "#F26B1D"
green = "#8BA86A"
cyan = "#7A9BA8"
blue = "#5C6E8A"
magenta = "#C45C58"
brown = "#A65B32"

bright_red = "#FF3B4E"
bright_yellow = "#FFD36A"
bright_green = "#C4D97A"
bright_cyan = "#A8C4CC"
bright_blue = "#8AA0C0"
bright_magenta = "#E88980"
