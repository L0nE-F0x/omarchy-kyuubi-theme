# Kyuubi — Nine tails. Unsealed.
# Engineered palette: Kurama chakra orange, bijuu crimson, ember gold,
# charred seal-black, and warm parchment ink. Every foreground and syntax
# token meets WCAG AA (>= 4.5:1) against both background and elevated cards.

mode = "dark"

# Core identity
accent = "#F26B1D"
