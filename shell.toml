# Kyuubi — Omarchy 4.5 Quickshell surfaces & interaction language.
#
# Warm seal-black glass lets Kurama bleed softly through chrome while keeping
# every control state immediately readable:
#   idle     -> quiet parchment + muted bronze seal border
#   hover    -> ember gold (#F0B429) highlights the pointer target
#   focus    -> chakra orange (#F26B1D) marks keyboard focus
#   selected -> chakra orange fill with warm parchment ink
#   urgent   -> bijuu crimson (#F04A58) signals alerts, recording, and errors

[bar]
background = "#100807"
background-alpha = 0.84
text = "#FCE6C8"
active = "#F04A58"
scale-with-font = true
size-horizontal = 26
size-vertical = 28

[hyprland]
active-border = "rgba(f26b1dee) rgba(f04a58ee) rgba(f0b429ee) 45deg"
active-border-foreground = "rgba(f26b1dee) rgba(f0b429ee) 45deg"

[controls]
normal-color = "#FCE6C8"
normal-fill-alpha = 0.04
normal-border = "#CA7642"
normal-border-width = 1
normal-border-alpha = 0.34

hover-cursor-color = "#F0B429"
hover-cursor-fill-alpha = 0.12
hover-cursor-border = "#F0B429"
hover-cursor-border-width = 1
hover-cursor-border-alpha = 0.68

focus-color = "#F26B1D"
focus-fill-alpha = 0.13
focus-border = "#F26B1D"
focus-border-width = 1
focus-border-alpha = 0.90

selected-color = "#F26B1D"
selected-fill-alpha = 0.22
selected-border = "#F26B1D"
selected-border-width = 1
selected-border-alpha = 0.72

pressed-fill-alpha = 0.28
selection-fill-alpha = 0.40

[spacing]
scale = 1.0
scale-with-font = true

[font]
base-size = 12

[popups]
background = "#160C0B"
background-alpha = 0.94
text = "#FCE6C8"
border = "hyprland.active-border"
border-alpha = 0.95

[tooltip]
background = "#261411"
background-alpha = 0.96
text = "#FFF4E4"
border = "#F0B429"
border-alpha = 0.88

[notifications]
background = "#160C0B"
background-alpha = 0.94
text = "#FCE6C8"
border = "hyprland.active-border"
border-alpha = 0.95
countdown = "#F26B1D"

[menu]
background = "#160C0B"
background-alpha = 0.93
text = "#FCE6C8"
border = "hyprland.active-border"
border-alpha = 0.92
scrim = "#090505"
scrim-alpha = 0.58
selected-background = "#F26B1D"
selected-background-alpha = 0.18
selected-text = "#FFF4E4"
selected-border = "hyprland.active-border-foreground"
selected-border-alpha = 0.58

[polkit]
background = "#160C0B"
background-alpha = 0.95
text = "#FCE6C8"
text-error = "#FF707C"
border = "hyprland.active-border"
border-error = "#F04A58"
border-alpha = 1.0
scrim = "#090505"
scrim-alpha = 0.62
accent = "#F26B1D"

[lock]
# Fire-seal tablet floating over the blurred Kurama wallpaper.
background = "#100807"
background-alpha = 0.72
text = "#FFF4E4"
placeholder = "#BE9779"
text-error = "#FF707C"
border = "#CA7642"
border-active = "hyprland.active-border"
border-error = "#F04A58"
border-alpha = 1.0
selection = "#F26B1D"
selection-alpha = 0.45

[image-picker]
text = "#FCE6C8"
selected-border = "#F26B1D"
selected-border-alpha = 1.0
unselected-border = "#A37B64"
unselected-border-alpha = 0.30
