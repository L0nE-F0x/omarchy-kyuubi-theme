# Kyuubi / Omarchy 4 Quickshell surfaces.
# Warm seal-black chrome, chakra-orange focus, crimson selection, ember-gold hover.
# Slightly see-through bar/launcher/lock so the fox art can show through.

[bar]
background = "#100807"
background-alpha = 0.82
text = "#FFE8C8"
active = "#F26B1D"
scale-with-font = true
size-horizontal = 26
size-vertical = 28

[hyprland]
active-border = "rgba(f26b1dee) rgba(c41e3aee) rgba(f0b429ee) 45deg"
active-border-foreground = "#FFF3E0"

[controls]
normal-color = "#FFE8C8"
normal-fill-alpha = 0.05
normal-border = "#A65B32"
normal-border-width = 1
normal-border-alpha = 0.45
hover-cursor-color = "#FFF3E0"
hover-cursor-fill-alpha = 0.10
hover-cursor-border = "#F0B429"
hover-cursor-border-width = 1
hover-cursor-border-alpha = 0.75
focus-color = "#FFF3E0"
focus-fill-alpha = 0.10
focus-border = "#F26B1D"
focus-border-width = 1
focus-border-alpha = 0.9
selected-color = "#FFF3E0"
selected-fill-alpha = 0.22
selected-border = "#C41E3A"
selected-border-width = 1
selected-border-alpha = 0.95
pressed-fill-alpha = 0.28
selection-fill-alpha = 0.40

[spacing]
scale = 1.0
scale-with-font = true

[font]
base-size = 12

[popups]
background = "#160C0B"
background-alpha = 0.92
text = "#FFE8C8"
border = "hyprland.active-border"
border-alpha = 0.95

[tooltip]
background = "#2A1610"
background-alpha = 0.96
text = "#FFE8C8"
border = "#F0B429"
border-alpha = 0.9

[notifications]
background = "#160C0B"
background-alpha = 0.92
text = "#FFE8C8"
border = "hyprland.active-border"
border-alpha = 0.95
countdown = "#C41E3A"

[launcher]
background = "#160C0B"
background-alpha = 0.88
text = "#FFE8C8"
border = "hyprland.active-border"
border-alpha = 0.9
scrim = "#0A0605"
scrim-alpha = 0.5
selected-background = "#5A1E14"
selected-background-alpha = 1.0
selected-text = "#FFF3E0"
selected-border = "#F26B1D"
selected-border-alpha = 0.95

[menu]
background = "#160C0B"
background-alpha = 0.90
text = "#FFE8C8"
border = "hyprland.active-border"
border-alpha = 0.9
scrim = "#0A0605"
scrim-alpha = 0.45
selected-background = "#5A1E14"
selected-background-alpha = 1.0
selected-text = "#FFF3E0"
selected-border = "#F26B1D"
selected-border-alpha = 0.95

[polkit]
background = "#160C0B"
background-alpha = 0.94
text = "#FFE8C8"
text-error = "#FF3B4E"
border = "hyprland.active-border"
border-error = "#C41E3A"
border-alpha = 1.0
scrim = "#0A0605"
scrim-alpha = 0.55
accent = "#F26B1D"

[lock]
# Centered password field reads as a fire-seal tablet on the blurred wallpaper.
background = "#100807"
background-alpha = 0.78
text = "#FFE8C8"
placeholder = "#A07A62"
text-error = "#FF3B4E"
border = "#A65B32"
border-active = "hyprland.active-border"
border-error = "#C41E3A"
border-alpha = 1.0
selection = "#F26B1D"
selection-alpha = 0.5

[image-picker]
text = "#FFE8C8"
selected-border = "#F26B1D"
selected-border-alpha = 1.0
unselected-border = "#A07A62"
unselected-border-alpha = 0.28
