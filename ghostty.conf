# Kyuubi Ghostty palette & terminal chrome.
# Local / non-git installs keep this file instead of regenerating from colors.toml.

background = #160C0B
foreground = #FCE6C8

# Chakra-orange block cursor; text beneath keeps cell-background legibility
cursor-color = #F26B1D
cursor-text = cell-background

# Blood-ember wash that preserves syntax colors inside selections
selection-background = #521D15
selection-foreground = cell-foreground

# Search highlights: ember gold for matches, chakra orange for active match
search-background = #F0B429
search-foreground = #090505
search-selected-background = #F26B1D
search-selected-foreground = #090505

# Focused pane clarity across terminal splits
split-divider-color = #8C341A
unfocused-split-opacity = 0.86

# 16-color palette (7 = light parchment, 15 = bright bone for TUI hierarchy)
palette = 0=#160C0B
palette = 1=#F04A58
palette = 2=#92B46E
palette = 3=#F0B429
palette = 4=#7C9BC8
palette = 5=#DE6B8A
palette = 6=#78AEBB
palette = 7=#E3C19E
palette = 8=#A37B64
palette = 9=#FF707C
palette = 10=#BCD982
palette = 11=#FFD46B
palette = 12=#A0BAE0
palette = 13=#F08EA8
palette = 14=#A4CCD4
palette = 15=#FFF4E4

# Subtle translucency so Kurama glows softly behind code without washing contrast
background-opacity = 0.90
